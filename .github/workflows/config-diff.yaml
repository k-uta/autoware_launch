name: config-diff

# Compare two config directories on the current branch and publish a display-only
# branch with one markdown file per component plus a portal index. The branch the
# workflow runs on is the branch being compared, so there is no branch input.

on:
  workflow_dispatch:
    inputs:
      config_dir_1:
        description: Baseline config directory, relative to autoware_launch/ (e.g. config)
        required: true
        type: string
        default: config
      config_dir_2:
        description: Target config directory to compare against, relative to autoware_launch/ (e.g. config_lv2)
        required: true
        type: string

permissions:
  contents: write

jobs:
  config-diff:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate config diff
        id: gen
        env:
          CONFIG_DIR_1: ${{ inputs.config_dir_1 }}
          CONFIG_DIR_2: ${{ inputs.config_dir_2 }}
          OUTPUT_DIR: ${{ runner.temp }}/config_diff
        run: |
          # Exits non-zero (failing the job) if either config directory is invalid.
          python3 .github/scripts/config_diff_tracker.py \
            --config-dir-1 "${CONFIG_DIR_1}" \
            --config-dir-2 "${CONFIG_DIR_2}" \
            --output-dir "${OUTPUT_DIR}" \
            --source-branch "${GITHUB_REF_NAME}" \
            --source-branch-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}"
          echo "out=${OUTPUT_DIR}" >> "${GITHUB_OUTPUT}"

      - name: Publish display branch
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIG_DIR_1: ${{ inputs.config_dir_1 }}
          CONFIG_DIR_2: ${{ inputs.config_dir_2 }}
          OUT: ${{ steps.gen.outputs.out }}
          FILE_COUNT: ${{ steps.gen.outputs.file_count }}
        run: |
          set -euo pipefail

          sanitize() { echo "$1" | tr '/ ' '--'; }
          display_branch="tmp/config-diff/$(sanitize "${GITHUB_REF_NAME}")/$(sanitize "${CONFIG_DIR_1}")-vs-$(sanitize "${CONFIG_DIR_2}")"

          # Assemble the branch in a clean directory so it only holds the markdown.
          work="${RUNNER_TEMP}/display"
          rm -rf "${work}"
          mkdir -p "${work}"
          cp -r "${OUT}/." "${work}/"

          cd "${work}"
          git init -q
          git checkout -q -b "${display_branch}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "config-diff: ${CONFIG_DIR_1} vs ${CONFIG_DIR_2} on ${GITHUB_REF_NAME}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${display_branch}"

          portal_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/blob/${display_branch}/README.md"
          {
            echo "## 🔍 Config diff published"
            echo ""
            echo "Comparison: \`${CONFIG_DIR_1}\` vs \`${CONFIG_DIR_2}\` (source branch: \`${GITHUB_REF_NAME}\`)"
            echo ""
            echo "- files with differences: ${FILE_COUNT}"
            echo ""
            echo "Display branch: \`${display_branch}\`"
            echo ""
            echo "[Open portal](${portal_url})"
          } >> "${GITHUB_STEP_SUMMARY}"
